<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AureVia Dashboard | 企業価値経営の羅針盤</title>
  <style>
    :root{
      --navy:#1F2D5C; --ink:#182134; --gold:#C7A25B; --cream:#F7F4ED;
      --gray:#6B7280; --line:#E5E7EB; --green:#10b981; --red:#dc2626; --amber:#F59E0B;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
      -webkit-font-smoothing:antialiased;background:var(--cream);color:var(--ink);
    }
    header{background:#fff;border-bottom:1px solid var(--line);padding:24px 32px}
    .header-content{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .header-left{display:flex;align-items:center;gap:12px}
    .container{max-width:1200px;margin:0 auto;padding:32px}
    .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:0;z-index:50;background:var(--cream);padding:14px 0 12px 0;box-shadow:0 6px 10px -8px rgba(24,33,52,.25)}
    .tab-btn{padding:12px 20px;border:none;background:transparent;color:var(--gray);cursor:pointer;font-size:14px;font-weight:500;border-radius:8px;transition:all .2s}
    .tab-btn:hover{background:rgba(31,45,92,.06)}
    .tab-btn.active{background:var(--navy);color:#fff;font-weight:600}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .card{background:#fff;border-radius:12px;padding:32px;margin-bottom:32px;border:2px solid var(--navy)}
    .card>h2{font-size:16px;font-weight:600;color:var(--gray);margin:0 0 24px 0}
    .simple-card{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
    table thead tr{border-bottom:2px solid var(--navy)}
    table th{padding:8px 4px;text-align:right;font-weight:600;color:var(--navy)}
    table th:first-child{text-align:left}
    table td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
    table td:first-child{text-align:left;font-weight:500}
    footer{background:#fff;border-top:1px solid var(--line);padding:32px;margin-top:24px}
    .footer-content{max-width:1200px;margin:0 auto}
    .insight-box{padding:20px;background:rgba(199,162,91,.08);border-left:4px solid var(--gold);border-radius:8px;line-height:1.7;font-size:13px;color:var(--ink)}
    .insight-box p{margin:0 0 12px 0}.insight-box p:last-child{margin:0}
    .pill{font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap}
    .pill-doing{background:rgba(31,45,92,.1);color:var(--navy)}
    .pill-plan{background:rgba(107,114,128,.1);color:var(--gray)}
    .pill-done{background:rgba(16,185,129,.12);color:var(--green)}
    .pill-pass{background:rgba(16,185,129,.14);color:var(--green)}
    .pill-fail{background:rgba(107,114,128,.12);color:var(--gray)}
    /* ---- inputs ---- */
    .form-section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
    .form-section>h3{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 4px 0}
    .form-section>.hint{font-size:12px;color:var(--gray);margin:0 0 16px 0}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:4px}
    .field label{font-size:12px;color:var(--gray);font-weight:600}
    input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
    input[type=number]{text-align:right}
    .num-table input{padding:5px 6px;font-size:11px}
    .num-table th{font-size:10px;padding:6px 4px}
    .num-table td{padding:4px 3px;border-bottom:1px solid var(--line)}
    .num-table td:first-child{font-weight:600;color:var(--navy)}
    .btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--navy);color:#fff}
    .btn-gold{background:var(--gold);color:#fff}
    .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .btn-sm{padding:6px 10px;font-size:12px}
    .btn-danger{background:#fff;border:1px solid var(--red);color:var(--red);padding:5px 9px;font-size:12px}
    .btn:hover{opacity:.9}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
    .action-edit{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff}
    .action-edit .ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .action-edit .ahead strong{font-size:13px;color:var(--navy)}
    .progress-track{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
    .progress-fill{height:100%;background:var(--gold);border-radius:6px}
    .saved-note{font-size:12px;color:var(--green);font-weight:600}
    .metric-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .metric-tab{padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--gray)}
    .metric-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .stage-block{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
    .stage-block.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
    .check-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .check-row input[type=checkbox]{width:auto;flex-shrink:0;transform:scale(1.15)}
    .adj-box{background:var(--cream);border-radius:8px;padding:12px;margin-top:8px}
    .ladder{display:flex;gap:8px;flex-wrap:wrap}
    .ladder-step{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
    .ladder-step.cur{border-color:var(--gold);background:rgba(199,162,91,.07)}
    .ladder-step.passed{background:rgba(16,185,129,.06)}
    #loandoc{display:none}
    @media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.container{padding:20px}}
    @media print{
      .tabs,.toolbar,.no-print{display:none!important}
      .tab-content{display:block!important;page-break-after:always}
      body{background:#fff}
      .card,.simple-card,.form-section,.stage-block{break-inside:avoid}
      body.print-bank .tab-content{display:none!important}
      body.print-bank #bankdoc{display:block!important;page-break-after:auto}
      body.print-bank #bankdoc .no-print{display:none!important}
      body.print-bank header{display:none!important}
      body.print-report .tab-content{display:none!important}
      body.print-report #report{display:block!important;page-break-after:auto}
      body.print-report #report .no-print{display:none!important}
      body.print-report header{display:none!important}
      body.print-report.only-vc .report-lens:not(.rl-vc){display:none!important}
      body.print-report.only-bank .report-lens:not(.rl-bank){display:none!important}
      body.print-report.only-ipo .report-lens:not(.rl-ipo){display:none!important}
      body.print-report.only-pe .report-lens:not(.rl-pe){display:none!important}
      body.print-report.only-vc #reportScorecard,body.print-report.only-bank #reportScorecard,body.print-report.only-ipo #reportScorecard,body.print-report.only-pe #reportScorecard{display:none!important}
      body.print-loandoc .tab-content{display:none!important}
      body.print-loandoc #loans{display:block!important;page-break-after:auto}
      body.print-loandoc #loans .no-print{display:none!important}
      body.print-loandoc #loans .loan-screen{display:none!important}
      body.print-loandoc #loandoc{display:block!important}
      body.print-loandoc header{display:none!important}
      #loandoc{display:none}
    }

    /* ---- AureVia Portal / cloud ---- */
    .portalbar{background:#0f2038;color:#fff;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
    .portalbar-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .portal-title{font-weight:700;letter-spacing:.08em;color:#d2b269;font-size:12px}.portal-spacer{flex:1}
    .cloud-status{font-size:11px;color:#b8c5d6;white-space:nowrap}.cloud-status.ok{color:#83d8bb}.cloud-status.warn{color:#e7c773}.cloud-status.err{color:#ff9b91}
    .company-switch{display:none;min-width:220px;width:auto;background:#152944;color:#fff;border:1px solid rgba(255,255,255,.18)}.company-switch.show{display:block}
    .portal-btn{width:auto;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:#192d49;color:#fff;cursor:pointer;font-weight:600}
    .portal-badge{font-size:11px;padding:5px 9px;border-radius:999px;background:rgba(199,162,91,.16);color:#e1c47d;border:1px solid rgba(199,162,91,.35)}
    .auth-overlay{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#0f1b2d,#13223a);display:flex;align-items:center;justify-content:center;padding:24px}.auth-overlay.hidden{display:none}
    .auth-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .auth-mark{width:42px;height:42px;border-radius:10px;background:#c7a25b;color:#14233a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
    .auth-error{display:none;margin-top:12px;padding:9px 11px;border-radius:8px;background:#fff0ed;color:#b84231;font-size:12px}.auth-error.show{display:block}
    .readonly-note{font-size:11px;color:var(--green);font-weight:700}input.shared-readonly{background:#f5f3ed!important;color:#5f6b7a!important}
    @media(max-width:760px){.portalbar-inner{align-items:stretch}.portal-spacer{display:none}.company-switch{width:100%}.portal-btn{flex:1}}

  </style>

<style>
/* ========================================================================
   AureVia 企業価値経営 — Responsive UX v1
   Phone = browse-first / input still available
   Tablet = near-desktop with touch optimization
   ======================================================================== */

/* Tablet / iPad */
@media (min-width:761px) and (max-width:1100px){
  .portalbar{padding:9px 12px}
  .portalbar-inner{gap:9px}
  header{padding:18px 18px}
  .container{padding:20px 16px}
  .tabs{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto;min-height:42px;padding:9px 13px}
  .btn{min-height:40px}
  input,select,textarea{min-height:40px}
}

/* Phone */
@media (max-width:760px){
  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  body{font-size:13px}

  /* ---- Portal bar ---- */
  .portalbar{
    padding:8px 10px 9px;
    position:sticky;
    top:0;
    z-index:90;
  }
  .portalbar-inner{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:7px 8px;
    width:100%;
    max-width:100%;
    align-items:center;
  }
  .portal-title{
    grid-column:1 / -1;
    font-size:10px;
    letter-spacing:.18em;
  }
  .portal-badge{
    font-size:10px;
    padding:4px 7px;
  }
  .portal-spacer{display:none}
  .company-switch.show{
    display:block;
    grid-column:1 / -1;
    width:100%;
    min-width:0;
    height:42px;
    font-size:16px;
  }
  .cloud-status{
    grid-column:1 / 2;
    font-size:10.5px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #saveBtn{
    grid-column:2 / 3;
    min-width:92px;
  }
  #logoutBtn{
    grid-column:1 / -1;
    width:100%;
  }
  .portal-btn{
    min-height:42px;
    padding:8px 10px;
    justify-content:center;
  }

  /* ---- Header ---- */
  header{
    padding:14px 12px;
  }
  .header-content{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }
  .header-left{width:100%}
  #hdrCompany{
    font-size:22px !important;
    line-height:1.25;
    overflow-wrap:anywhere;
  }
  .header-content>div:last-child{
    width:100%;
    text-align:left !important;
  }
  .header-content>div:last-child>div{
    justify-content:flex-start !important;
  }
  .header-content h1{
    font-size:16px !important;
  }

  /* ---- Main ---- */
  .container{
    width:100%;
    max-width:100%;
    padding:12px 10px 60px;
    overflow:hidden;
  }

  /* horizontal swipe only for app tabs */
  .tabs{
    position:sticky;
    top:0;
    z-index:60;
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scrollbar-width:none;
    gap:6px;
    padding:8px 0 9px;
    margin-bottom:14px;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{
    flex:0 0 auto;
    min-height:42px;
    padding:9px 12px;
    font-size:12px;
    white-space:nowrap;
  }

  /* Cards */
  .card{
    padding:16px;
    margin-bottom:16px;
    border-width:1px;
    border-radius:12px;
    min-width:0;
    max-width:100%;
    overflow:hidden;
  }
  .card>h2{
    margin-bottom:14px;
    font-size:15px;
  }
  .simple-card,.form-section,.stage-block,.action-edit{
    padding:14px;
    margin-bottom:14px;
    min-width:0;
    max-width:100%;
    overflow:hidden;
  }

  /* Layout grids collapse on phone */
  .grid2,.grid3{
    grid-template-columns:1fr !important;
    gap:10px;
  }
  .ladder{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .ladder-step{
    min-width:0;
    width:100%;
  }

  /* Controls */
  input,select,textarea{
    width:100%;
    max-width:100%;
    min-height:43px;
    font-size:16px; /* avoid iOS zoom-on-focus */
    padding:9px 10px;
  }
  textarea{min-height:110px}
  .num-table input{
    min-height:38px;
    min-width:74px;
    font-size:14px;
  }
  .btn{
    min-height:42px;
    padding:8px 12px;
  }
  .toolbar{
    gap:8px;
    margin-bottom:14px;
  }
  .toolbar .btn{
    flex:1 1 140px;
  }

  .metric-tabs{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .metric-tabs::-webkit-scrollbar{display:none}
  .metric-tab{
    flex:0 0 auto;
    min-height:38px;
  }

  /* Tables: only the table wrapper scrolls, not the whole page */
  table{
    font-size:11px;
  }
  table th,table td{
    padding:7px 7px;
    white-space:nowrap;
  }

  /* Any existing inline overflow-x:auto wrapper becomes the deliberate scroller */
  [style*="overflow-x:auto"]{
    max-width:100%;
    overflow-x:auto !important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  [style*="overflow-x:auto"] table{
    width:max-content;
    min-width:100%;
  }

  /* Raw tables without a wrapper should still stay usable */
  .num-table{
    width:max-content;
    min-width:100%;
  }

  /* keep first column visible in wide numeric tables */
  .num-table th:first-child,
  .num-table td:first-child{
    position:sticky;
    left:0;
    z-index:3;
    background:#fff;
    box-shadow:1px 0 0 var(--line);
  }
  .num-table thead th:first-child{z-index:5}

  /* Avoid layout drift from inline flex blocks */
  [style*="display:flex"]{
    max-width:100%;
  }
  [style*="min-width:280px"],
  [style*="min-width:260px"],
  [style*="min-width:320px"]{
    min-width:0 !important;
  }

  /* Auth screen */
  .auth-overlay{padding:14px}
  .auth-card{
    width:100%;
    max-width:430px;
    padding:22px 18px;
    border-radius:14px;
  }

  /* Misc */
  img,canvas,svg{max-width:100%}
  h1,h2,h3,h4,p,.hint,.insight-box{
    overflow-wrap:anywhere;
  }
}

/* Narrow iPhones */
@media (max-width:430px){
  .portalbar{padding-left:8px;padding-right:8px}
  .container{padding-left:8px;padding-right:8px}
  .tab-btn{padding:8px 10px}
  .card{padding:13px}
  .simple-card,.form-section,.stage-block,.action-edit{padding:12px}
}
</style>


<style>
/* Mobile refinement — valuation comparison gets breathing room */
@media (max-width:760px){
  .value-target-card{
    overflow:visible;
  }

  .value-compare-grid{
    grid-template-columns:1fr !important;
    gap:18px !important;
  }

  .value-compare-grid > div{
    min-width:0;
  }

  .value-compare-grid > div:first-child,
  .value-compare-grid > div:last-child{
    padding:14px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }

  .value-compare-arrow{
    padding-top:0 !important;
    gap:3px !important;
    min-height:auto !important;
  }
  .value-compare-arrow span:first-child{
    transform:rotate(90deg);
    font-size:24px !important;
    line-height:1;
  }

  /* Keep the headline amount and comparison readable, not crushed */
  .value-compare-grid > div:first-child > div:first-child,
  .value-compare-grid > div:last-child > div:first-child{
    gap:16px !important;
    align-items:flex-start !important;
  }

  .value-compare-grid > div:first-child > div:first-child > div:first-child,
  .value-compare-grid > div:last-child > div:first-child > div:first-child{
    flex:1 1 auto;
    min-width:0;
  }

  .value-compare-grid > div:first-child > div:first-child > div:last-child,
  .value-compare-grid > div:last-child > div:first-child > div:last-child{
    flex:0 0 118px;
    min-width:0;
  }

  /* Override desktop inline headline sizes */
  .value-compare-grid > div:first-child > div:first-child > div:first-child p:nth-child(2){
    font-size:34px !important;
    line-height:1.1 !important;
    overflow-wrap:normal !important;
    word-break:keep-all;
  }
  .value-compare-grid > div:last-child > div:first-child > div:first-child p:nth-child(2){
    font-size:30px !important;
    line-height:1.1 !important;
    overflow-wrap:normal !important;
    word-break:keep-all;
  }

  .value-compare-grid > div:first-child > div:first-child > div:last-child p:nth-child(2),
  .value-compare-grid > div:last-child > div:first-child > div:last-child p:nth-child(2){
    font-size:16px !important;
    line-height:1.35 !important;
  }

  .value-method-grid{
    grid-template-columns:1fr !important;
    gap:12px !important;
    margin-top:18px !important;
    padding-top:18px !important;
  }

  .value-method-grid > div{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .value-method-grid > div:last-child{
    border-bottom:none;
  }
}

@media (max-width:430px){
  .value-compare-grid > div:first-child > div:first-child,
  .value-compare-grid > div:last-child > div:first-child{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) 108px;
    gap:12px !important;
  }

  .value-compare-grid > div:first-child > div:first-child > div:last-child,
  .value-compare-grid > div:last-child > div:first-child > div:last-child{
    width:108px;
  }

  .value-compare-grid > div:first-child > div:first-child > div:first-child p:nth-child(2){
    font-size:31px !important;
  }
  .value-compare-grid > div:last-child > div:first-child > div:first-child p:nth-child(2){
    font-size:27px !important;
  }
}
</style>

</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:20px"><div class="auth-mark">A</div><div><div style="font-size:20px;font-weight:700;color:#182134">AureVia 企業価値経営</div><div style="font-size:12px;color:#6B7280">Enterprise Value Management</div></div></div>
      <form id="loginForm"><div class="field"><label>メールアドレス</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">ログイン</button></form>
      <div class="auth-error" id="authError"></div>

/* ---------- 基本ユーティリティ（表示は千円＝円/1000） ---------- */
const yen=n=>(n==null||isNaN(n))?"–":Math.round(num(n)/1000).toLocaleString("ja-JP");
const pct=n=>(n==null||isNaN(n))?"–":(n>=0?"+":"")+n.toFixed(1)+"%";
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const signed=n=>(n>=0?"+":"")+yen(n);
function sumAdj(list){return (list||[]).reduce((s,a)=>s+num(a.amount),0);}
function ncv(period,k){const n=(state.nc&&state.nc[period])||{};return n[k]==null?'':n[k];}
function netCash(period){const n=(state.nc&&state.nc[period])||{};const useLoan=(period==='now'&&Array.isArray(state.loans)&&state.loans.length>0);let lp=null;if(useLoan)lp=existingDebtParts();return NC_ITEMS.reduce((s,it)=>{let v=num(n[it[0]]);if(useLoan&&it[0]==='std')v=lp.std;if(useLoan&&it[0]==='ltd')v=lp.ltd;return s+it[2]*v;},0);}

function landing(metric){
  return state.months.reduce((s,m)=>s+(m[metric].a!=null?num(m[metric].a):num(m[metric].b)),0);
}
function budgetTotal(metric){return state.months.reduce((s,m)=>s+num(m[metric].b),0);}
function priorTotal(metric){return state.months.reduce((s,m)=>s+num(m[metric].p),0);}
function lastActualIdx(){
  for(let i=state.months.length-1;i>=0;i--){if(state.months[i].sales.a!=null)return i;}
  return 0;
}
/* 直近12か月の積み上げ：最後に実績が入っている月まで当期実績、その先は前期実績で埋める */
function trailingIdx(){let li=-1;for(let i=0;i<12;i++){if(state.months[i].sales.a!=null)li=i;}return li;}
function trailing12(metric){
  const li=trailingIdx();
  if(li<0)return priorTotal(metric);   // 実績未入力なら前期12か月
  let s=0;
  for(let i=0;i<=li;i++)s+=num(state.months[i][metric].a);        // 当期実績 0..li
  for(let i=li+1;i<12;i++)s+=num(state.months[i][metric].p);      // 前期実績 li+1..11
  return s;
}

  const tot=st.items.reduce((s,it)=>s+(num(it.w)||1),0);
  if(!tot)return 0;
  const got=st.items.reduce((s,it)=>s+(it.done?(num(it.w)||1):0),0);
  return got/tot;   // 重み付き達成率
}
function stagePassed(i){return stageAchieve(i) >= num(state.stages[i].passRate);}
function currentStageIdx(){
  let passedUpto=-1;
  for(let i=0;i<state.stages.length;i++){ if(stagePassed(i)) passedUpto=i; else break; }
  return Math.max(0, passedUpto);
}

/* ---------- 企業価値算定 ---------- */
function valuation(){
  const i=currentStageIdx();
  const st=state.stages[i], def=STAGE_DEFS[i];
  const achieve=stageAchieve(i);
  const M = (st.multLow==null||st.multLow==="") ? null
          : num(st.multLow)+(num(st.multHigh)-num(st.multLow))*achieve;
  const adjE=sumAdj(state.ebitdaAdj), adjB=sumAdj(state.bookAdj);
  const ebBaseNow=trailing12("ebitda"), ebBasePrev=priorTotal("ebitda");   // 現時点は直近12か月積み上げ
  const ebNow=ebBaseNow+adjE, ebPrev=ebBasePrev+adjE;
  const ncNow=netCash('now'), ncPrev=netCash('prev');
  const dcfRawNow=num(state.dcfNow), dcfRawPrev=num(state.dcfPrev);
  const dcfNow=dcfRawNow+ncNow, dcfPrev=dcfRawPrev+ncPrev;   // DCFも＋ネットキャッシュ
  const bookBaseNow=num(state.bookNow), bookBasePrev=num(state.bookPrev);
  const bookNow=bookBaseNow+adjB, bookPrev=bookBasePrev+adjB;

  /* ---- 現時点（当ステージ・達成率で補間） ---- */
  const evNow = M==null?null:ebNow*M+ncNow;        // EBITDA×倍率 ＋ネットキャッシュ
  // シード等で倍率が「適用なし」の場合、次に倍率があるステージの倍率で参考表示
  let refM=M, refStageIdx=i, refIsNext=false;
  if(M==null){
    for(let j=i+1;j<state.stages.length;j++){
      const sj=state.stages[j];
      if(sj.multLow!=null&&sj.multLow!==""){
        refStageIdx=j; refIsNext=true;
        refM=num(sj.multLow)+(num(sj.multHigh)-num(sj.multLow))*stageAchieve(j);
        break;
      }
    }
  }
  const evNowDisp = refM==null?null:ebNow*refM+ncNow;
  /* ロジック値：シード＝純資産法／それ以外＝EBITDA×倍率（＋ネットキャッシュ）。DCFは廃止。 */
  let logicNow, logicLabel;
  if(i===0){ logicNow=bookNow; logicLabel="純資産法"; }
  else { logicNow=evNow; logicLabel="EBITDAマルチプル法"; }
  const roundV=num(state.roundValue);
  /* IPO達成チェック：期別業績「当期(進行)」のIPOフラグがON → 類似PER評価（当期着地の税後純利益 × 加重平均PER）を最優先で採用 */
  const ipoAchieved = !!(state.periods && state.periods[3] && state.periods[3].ipo);
  const perNow = blendedPER(3);          // 当期構成比で加重した類似企業PER
  const netNow = landing("net");         // 当期着地の税後純利益
  const perValue = netNow*perNow;
  const ipoAdopted = ipoAchieved && perValue>0;
  /* 優先順位：IPO達成（類似PER） ＞ 直近ラウンド・セカンダリー ＞ ロジック値 */
  const roundAdopted = !ipoAdopted && roundV>0 && roundV>logicNow;
  let now, methodLabel;
  if(ipoAdopted){ now=perValue; methodLabel="類似PER評価（IPO達成）"; }
  else if(roundAdopted){ now=roundV; methodLabel="直近ラウンド・セカンダリー評価額"; }
  else { now=logicNow; methodLabel=logicLabel; }

  /* ---- 前期末（前期末時点ステージ・達成率補間なし＝レンジ中央値の目安） ---- */
  const jPrev = (state.prevStageIdx!=null && state.stages[num(state.prevStageIdx)]) ? num(state.prevStageIdx) : i;
  const stP=state.stages[jPrev];
  const Mprev=(stP.multLow==null||stP.multLow==="")?null:(num(stP.multLow)+num(stP.multHigh))/2;
  const evPrev=Mprev==null?null:ebPrev*Mprev+ncPrev;
  const wP=DCF_WEIGHTS[jPrev], dcfUsedP=!!(state.hasBizPlan&&wP);
  let prev, prevMethodLabel;
  if(jPrev===0){ prev=bookPrev; prevMethodLabel="純資産法"; }
  else if(dcfUsedP){ prev=wP[0]*evPrev+wP[1]*dcfPrev; prevMethodLabel=`EBITDA評価 ${Math.round(wP[0]*100)}％ ＋ DCF ${Math.round(wP[1]*100)}％`; }
  else { prev=evPrev; prevMethodLabel="EBITDAマルチプル法"; }

  return {i,def,achieve,M,Mprev,jPrev,adjE,adjB,ebBaseNow,ebBasePrev,ebNow,ebPrev,
          ncNow,ncPrev,evNow,evPrev,dcfUsed:false,w:null,
          refM,refStageIdx,refIsNext,evNowDisp,
          logicNow,logicLabel,roundV,roundAdopted,ipoAchieved,ipoAdopted,perNow,perValue,netNow,
          now,prev,methodLabel,prevMethodLabel,
          book:{now:bookNow,prev:bookPrev,baseNow:bookBaseNow},
          dcf:{now:dcfNow,prev:dcfPrev,rawNow:dcfRawNow}};
}
function kpis(){
  const v=valuation();
  const landSales=landing("sales"), landEbitda=landing("ebitda");
  const margin=landSales? landEbitda/landSales*100 : 0;
  const prevSales=priorTotal("sales");
  const growth=prevSales? (landSales-prevSales)/prevSales*100 : 0;
  const reach=num(state.targetValue)? v.now/num(state.targetValue)*100 : 0;
  return {v,margin,growth,reach,delta:v.now-v.prev,toTarget:num(state.targetValue)-v.now};
}
/* 余裕資金（投資可能資金）※ネットキャッシュ入力から算定・新規入力なし */
function liquidityCalc(){
  const nc=(state.nc&&state.nc.now)||{};
  const ap=num(nc.ap), accrued=num(nc.accrued), accruedExp=num(nc.accruedExp), cash=num(nc.cash);
  const need=(ap+accrued)*5+accruedExp;              // 必要資金＝（買掛金＋未払金）×5＋未払費用
  const surplus=cash-need;                            // 余裕資金＝現預金−必要資金
  const payables=ap+accrued+accruedExp;
  const months=surplus<0?0:(payables>0?surplus/payables:0);
  let statusText,icon,bColor;
  if(surplus<0){statusText='資金確保を優先';icon='🔴';bColor='var(--red)';}
  else if(surplus<need){statusText='慎重な投資判断推奨';icon='🟡';bColor='var(--gold)';}
  else {statusText='投資余力あり';icon='🟢';bColor='var(--green)';}
  const color=surplus>=0?'var(--green)':'var(--red)';
  const disp=(surplus>=0?'＋':'▲')+Math.abs(Math.round(surplus)).toLocaleString('ja-JP')+'円';
  return {cash,need,surplus,payables,months,statusText,icon,bColor,color,disp};
}
/* 前期末比の内訳（EBITDA要因／ステージ評価要因／その他） */
function deltaBreakdown(){
  const v=valuation();
  if(v.roundAdopted||v.ipoAdopted||v.M==null||v.Mprev==null) return {applicable:false};
  const hb=state.hasBizPlan, wNow=DCF_WEIGHTS[v.i], wPrev=DCF_WEIGHTS[v.jPrev];
  const ev=(eb,M,w,nc,dcfRaw)=>{const e=eb*M+nc;return (hb&&w)?w[0]*e+w[1]*(dcfRaw+nc):e;};
  const dRawNow=num(state.dcfNow), dRawPrev=num(state.dcfPrev);
  const prevV=ev(v.ebPrev,v.Mprev,wPrev,v.ncPrev,dRawPrev);
  const A=ev(v.ebNow,v.Mprev,wPrev,v.ncPrev,dRawPrev);   // EBITDAのみ現時点に
  const B=ev(v.ebNow,v.M,wNow,v.ncPrev,dRawPrev);        // ＋ステージ（倍率）も現時点に
  const nowV=ev(v.ebNow,v.M,wNow,v.ncNow,dRawNow);       // ＋NC/DCFも現時点に
  return {applicable:true,ebitda:A-prevV,stage:B-A,other:nowV-B,total:nowV-prevV};
}
/* マイルストーン（次の壁）への到達条件：
   ステージ移行は「次の1つ」までに留め、残りの差分はEBITDA増加（経営・営業努力）で表現する */
function milestonePath(){
  const v=valuation();
  const target=num(state.milestoneValue);
  const eb=v.ebNow, nc=v.ncNow;
  const reached=target>0 && v.now>=target;
  if(target<=0||eb<=0) return {invalid:true,reached};
  // 次のステージ（せいぜい1つ上。倍率があるところまで進める）
  let s=v.i+1;
  while(s<state.stages.length && (state.stages[s].multLow==null||state.stages[s].multLow==="")) s++;
  const moved = s<state.stages.length;
  const sIdx = moved ? s : v.i;
  const st=state.stages[sIdx];
  if(st.multLow==null||st.multLow==="") return {invalid:true,reached,noMult:true,eb,nc};
  // 採用倍率：次ステージなら「合格基準で入った時点」の倍率、現ステージ維持なら現倍率
  const M = moved ? num(st.multLow)+(num(st.multHigh)-num(st.multLow))*num(st.passRate)
                  : (v.M||num(st.multLow));
  const w=DCF_WEIGHTS[sIdx];
  const dcfUsed=!!(state.hasBizPlan && w);
  const dcfVal=num(state.dcfNow)+nc;            // DCF評価（＋NC）
  // target = we*(EB*M + nc) + wd*dcfVal  をEBについて解く（DCF非加重なら we=1, wd=0）
  const ebReq = dcfUsed ? ((target - w[1]*dcfVal)/w[0] - nc)/M : (target - nc)/M;
  return {invalid:false,reached,target,eb,nc,M,sIdx,moved,cur:v.i,
          ebReq,ebInc:ebReq-eb,dcfUsed,passRate:num(st.passRate)};
}

/* 次の目標（目標企業価値・目標売上高）に必要な要件を表示：必要ステージ／必要EBITDA／必要EBITDAマージン。
   算定ロジックは従来のmilestonePath（次に1ステージまで移行 → 残差はEBITDAで解く）を踏襲。 */
function milestoneCondHTML(){
  const mp=milestonePath();
  if(!mp||mp.invalid){
    if(mp&&mp.noMult) return '<p style="font-size:12px;color:var(--gray);margin:14px 0 0 0">まずは次のステージ（EBITDA倍率の適用開始）への移行が必要です。判定項目の達成を進めてください。</p>';
    return '<p style="font-size:11px;color:var(--gray);margin:14px 0 0 0">目標企業価値を入力すると必要要件を表示します。</p>';
  }
  if(mp.reached) return '<p style="font-size:13px;color:var(--green);font-weight:600;margin:14px 0 0 0">✓ 現時点ですでに目標企業価値に到達しています。</p>';
  const ts=num(state.milestoneSales);
  const reqMargin = ts>0 ? mp.ebReq/ts*100 : null;   // 必要EBITDAマージン＝必要EBITDA÷目標売上高
  const stageBig = mp.moved ? `Stage${mp.sIdx+1} ${STAGE_DEFS[mp.sIdx].name}` : `Stage${mp.cur+1} ${STAGE_DEFS[mp.cur].name}`;
  const stageSub = mp.moved ? `現Stage${mp.cur+1} ${STAGE_DEFS[mp.cur].name}から移行（達成率${(mp.passRate*100).toFixed(0)}%以上 → 倍率 約${mp.M.toFixed(2)}倍）` : `現ステージを維持（倍率 約${mp.M.toFixed(2)}倍）`;
  const ebSub = mp.ebInc>0 ? `現状(修正後) ${yen(mp.eb)} から +${yen(mp.ebInc)}千円 拡大` : `現状(修正後 ${yen(mp.eb)}千円)でも到達可能・ステージ移行が主条件`;
  const marginSub = ts>0 ? `必要EBITDA ${yen(mp.ebReq)} ÷ 目標売上高 ${yen(ts)}千円` : '目標売上高を入力すると算定します';
  return `<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)">
    <p style="font-weight:700;color:var(--navy);margin:0 0 10px 0;font-size:13px">目標達成に必要な要件（目安）</p>
    <div class="grid3">
      ${calcStep("必要ステージ",stageBig,stageSub)}
      ${calcStep("必要EBITDA（修正後）",yen(mp.ebReq)+"千円",ebSub)}
      ${calcStep("必要EBITDAマージン",reqMargin==null?"—":reqMargin.toFixed(1)+"%",marginSub)}
    </div>
    <p style="font-size:10px;color:var(--gray);margin:8px 0 0 0">※ ネットキャッシュ ${signed(mp.nc)}千円を考慮したEBITDA基準の目安です。必要EBITDAは「目標企業価値 − ネットキャッシュ ÷ 適用倍率」、必要EBITDAマージンは目標売上高に対する比率です。</p>
  </div>`;
}

function monthlyTable(metric,mode){

function barChart(metric,mode){
  const prev=mode==='prev';
  const labels=mlabels();
  const data=state.months.map((m,i)=>({label:labels[i],cur:m[metric].a!=null?num(m[metric].a):null,pri:prev?num(m[metric].p):num(m[metric].b)}));
  const vals=[]; data.forEach(d=>{ if(d.cur!=null)vals.push(d.cur); vals.push(d.pri); });
  let maxV=Math.max(0,...vals), minV=Math.min(0,...vals);
  const range=(maxV-minV)||1;                 // ゼロを必ず含めたレンジ（マイナス対応）
  const gw=80, W=Math.max(760,data.length*gw), H=220, topPad=24, botPad=30;
  const plotH=H-topPad-botPad;
  const y=v=> topPad + (maxV - v)/range * plotH;   // 値→y座標
  const zeroY=y(0);
  let g=`<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" stroke="#c2c8d2" stroke-width="1"/>`;
  data.forEach((d,i)=>{
    const cx=i*gw+gw/2, pX=cx-15, cX=cx+3;
    // 前期実績バー
    const pT=y(Math.max(d.pri,0)), pB=y(Math.min(d.pri,0));
    g+=`<rect x="${pX}" y="${pT.toFixed(1)}" width="12" height="${Math.max(0,pB-pT).toFixed(1)}" fill="var(--navy)" opacity="0.35" rx="1"/>`;
    if(d.pri!==0) g+=`<text x="${pX+6}" y="${(d.pri>=0?pT-4:pB+11).toFixed(1)}" font-size="8.5" fill="#9aa1ad" text-anchor="middle">${yen(d.pri)}</text>`;
    // 当期実績バー
    if(d.cur!=null){
      const cT=y(Math.max(d.cur,0)), cB=y(Math.min(d.cur,0));
      g+=`<rect x="${cX}" y="${cT.toFixed(1)}" width="12" height="${Math.max(0,cB-cT).toFixed(1)}" fill="${d.cur<0?'var(--red)':'var(--navy)'}" rx="1"/>`;
      if(d.cur!==0) g+=`<text x="${cX+6}" y="${(d.cur>=0?cT-4:cB+11).toFixed(1)}" font-size="9.5" fill="${d.cur<0?'var(--red)':'var(--navy)'}" font-weight="700" text-anchor="middle">${yen(d.cur)}</text>`;
    }
    g+=`<text x="${cx}" y="${H-10}" font-size="10.5" fill="#6B7280" text-anchor="middle">${d.label}</text>`;
  });
  return `<div style="overflow-x:auto;background:var(--cream);border-radius:6px;padding:10px 8px">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none">${g}</svg>
    <p style="font-size:10px;color:var(--gray);margin:6px 0 0 4px">数値の単位：千円（横線がゼロ基準）</p></div>`;
}

function investSums(){
  const list=state.investments||[];
  const sum=(arr,f)=>arr.reduce((s,x)=>s+num(x[f]),0);
  const rev=list.filter(x=>x.category!=='cost'), cost=list.filter(x=>x.category==='cost');
  const investNeed=list.filter(x=>x.needFunding!==false).reduce((s,x)=>s+num(x.amount),0); // 資金調達対象のみ
  return {invest:sum(list,'amount'),investNeed,impact:sum(list,'impact'),
          revImpact:sum(rev,'impact'),costImpact:sum(cost,'impact'),count:list.length};
}
function gapEbitda(){const mp=milestonePath();return (mp&&!mp.invalid&&!mp.reached&&mp.ebInc>0)?mp.ebInc:0;}
function subsidyAmt(x){return num(x.subRate)>0 ? num(x.amount)*num(x.subRate)/100 : num(x.subAmount);}

/* =========================================================
   資金調達計画
   ========================================================= */
function fundingSums(){
  const need=investSums().investNeed;
  const debt=(state.debts||[]).reduce((s,d)=>s+num(d.amount),0);          // 新規借入
  const ncNow=(state.nc&&state.nc.now)||{};
  const _ed=existingDebtParts();                                           // 借入戦略タブ（借入一覧）を正として連動
  const stdNow=_ed.std, ltdNow=_ed.ltd;
  const existingDebt=stdNow+ltdNow;                                        // 現状の借入（短期＋長期）
  const debtTotal=existingDebt+debt;                                       // デット総額（現状＋新規）
  const subsidy=(state.investments||[]).reduce((s,x)=>s+subsidyAmt(x),0);
  const equity=Object.values(capSim().equityByYear).reduce((s,v)=>s+num(v),0);   // 希薄化イベント（新株発行）から連携
  const cash=num(ncNow.cash);
  const lf=liquidityCalc();                    // Compassの余裕資金ロジックに統一
  const cashNeed=lf.need, surplus=lf.surplus;  // 必要資金／余裕資金
  const cashAvail=Math.max(0,surplus);         // 手元投資余力＝余裕資金（下限0）
  const total=debt+subsidy+equity+cashAvail;                              // 新規調達合計（既存借入は含めない）
  return {need,debt,stdNow,ltdNow,existingDebt,debtTotal,subsidy,equity,cash,cashNeed,surplus,cashAvail,total,gap:total-need};
}

function spCurrentSales(){return landing("sales");}      // 今期売上（当期着地）を自動連携
function spPrevSales(){return priorTotal("sales");}      // 前期売上（前期実績12か月）を自動連携
function salesPlanCalc(){
  const sp=state.salesPlan||{};
  const N=(num(sp.planYears)===3)?3:5;      // 今期を含む期間数
  const g=num(sp.marketGrowth)/100, m0=num(sp.marketSize);   // m0=前期末市場規模
  // 前期(idx0) → 今期(idx1=前期×(1+g)) → 将来(idx2..N)（今期含めN期間＋前期）
  // 売上高は全期、期別業績（月次連携・成長踏襲込み）から自動連携：前期=idx2, 今期=idx3, n年後=idx(3+n)
  const years=[
    {key:'prev',label:'前期（'+fyStr(-1)+'）',market:m0,           sales:periodSalesAt(2), people:num(sp.prevSalesPeople), emp:num(sp.prevEmployees), fi:-1},
    {key:'cur', label:'今期（'+fyStr(0)+'）',market:m0*(1+g),     sales:periodSalesAt(3), people:num(sp.salesPeople),     emp:num(sp.totalEmployees), fi:-1}
  ];
  for(let f=0;f<N-1;f++){
    const idx=f+2;
    years.push({key:'f'+f,label:(f+1)+'年後（'+fyStr(f+1)+'）',market:m0*Math.pow(1+g,idx),
      sales:periodSalesAt(4+f),
      people:num((sp.salesPeopleByYear||[])[f]),
      emp:num((sp.employeesByYear||[])[f]), fi:f});
  }
  const share0=years[1].market>0?years[1].sales/years[1].market*100:0;   // 今期シェアを基準
  years.forEach((y,i)=>{
    y.share=y.market>0?y.sales/y.market*100:0;
    y.shareDelta=y.share-share0;
    y.shareYoY=i>0?y.share-years[i-1].share:0;
    y.revPerSales=y.people>0?y.sales/y.people:0;
    y.revPerEmp=y.emp>0?y.sales/y.emp:0;
  });
  return {N,years,share0};
}
function salesComboChart(years){
  const n=years.length;
  const maxMarket=Math.max(1,...years.map(y=>y.market));
  const maxShare=Math.max(0.1,...years.map(y=>y.share));
  const colW=Math.max(96,700/n), W=Math.max(700,n*colW), H=270, topPad=20, botPad=44;
  const plotH=H-topPad-botPad, base=H-botPad;
  const yBar=v=>base-(v/maxMarket)*plotH, yLine=s=>base-(s/maxShare)*plotH;
  let g='';
  years.forEach((y,i)=>{
    const cx=i*colW+colW/2, bw=15, mX=cx-bw-2, sX=cx+2;
    g+=`<rect x="${mX.toFixed(1)}" y="${yBar(y.market).toFixed(1)}" width="${bw}" height="${(base-yBar(y.market)).toFixed(1)}" fill="var(--navy)" opacity="0.22" rx="1"/>`;
    g+=`<rect x="${sX.toFixed(1)}" y="${yBar(y.sales).toFixed(1)}" width="${bw}" height="${(base-yBar(y.sales)).toFixed(1)}" fill="var(--gold)" rx="1"/>`;
    g+=`<text x="${cx.toFixed(1)}" y="${(H-26).toFixed(1)}" font-size="10" fill="#6B7280" text-anchor="middle">${y.label}</text>`;
    g+=`<text x="${cx.toFixed(1)}" y="${(H-12).toFixed(1)}" font-size="9.5" fill="var(--gold)" font-weight="700" text-anchor="middle">${y.share.toFixed(2)}%</text>`;
  });
  const pts=years.map((y,i)=>[i*colW+colW/2,yLine(y.share)]);
  g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2"/>`;
  pts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--gold)"/>`;});
  return `<div style="overflow-x:auto;background:var(--cream);border-radius:8px;padding:12px">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none">${g}</svg>
    <div style="display:flex;gap:18px;font-size:11px;margin-top:8px;flex-wrap:wrap">
      <span><span style="display:inline-block;width:11px;height:11px;background:var(--navy);opacity:.22;border-radius:2px;vertical-align:middle"></span> 市場規模</span>
      <span><span style="display:inline-block;width:11px;height:11px;background:var(--gold);border-radius:2px;vertical-align:middle"></span> 売上目標</span>
      <span><span style="display:inline-block;width:16px;height:2px;background:var(--gold);vertical-align:middle"></span> 市場シェア（折れ線・％）</span>
    </div></div>`;
}

/* IPO期（期別業績でIPOチェックした最初の期）の企業価値＝PER評価。無ければnull */
function ipoPeriodValue(){const i=ipoYearIdx();if(i<0)return null;const cp=computedPeriods();return cp[i]?num(periodValue(cp[i],i).value):null;}
/* IPO時 想定企業価値：手入力(ipoValue>0)を優先、0ならIPO期の企業価値、無ければ目標企業価値 */
function capIpoValue(){const c=state.capital||{};if(num(c.ipoValue)>0)return num(c.ipoValue);const ev=ipoPeriodValue();return (ev!=null&&ev>0)?ev:num(state.targetValue);}
/* ==== 資本戦略エンジン（年度イベント方式の希薄化） ==== */
const CAP_PARTIES=[['founder','創業者'],['officer','役員'],['employee','従業員'],['vc','VC'],['other','その他']];
const CAP_KEYS=CAP_PARTIES.map(p=>p[0]);
const CAP_PARTY_LABEL={founder:'創業者',officer:'役員',employee:'従業員',vc:'VC',other:'その他',public:'市場（流通）'};
function capCurYear(){return baseYear();}
function capYearOffsets(){const y0=capCurYear();return Array.from({length:6},(_,d)=>y0+d);}
function capYearLabel(d){return (d===0?'当期':d+'年後');}
/* IPO予定年度：期別業績でIPOにチェックが入った最初の期の年度に連動。無ければ null（未定） */
function ipoYearIdx(){const ps=state.periods||[];for(let i=0;i<ps.length;i++){if(ps[i]&&ps[i].ipo)return i;}return -1;}
function ipoYearNum(){const i=ipoYearIdx();return i<0?null:baseYear()+(i-3);}
/* 計画上の企業価値（円）：offset0=当期(進行)予算…offset5=5年後（期別業績の企業価値と連携） */
function plannedEV(d){const ps=computedPeriods();const p=ps[3+d];return p?num(periodValue(p,3+d).value):num(valuation().now);}
function capBase(){const c=state.capital||{};return {founder:num(c.founderShares),officer:num(c.officerShares),employee:num(c.employeeShares),vc:num(c.vcShares),other:num(c.otherShares)};}
function capBaseSO(){const c=state.capital||{};return {founder:num(c.founderSO),officer:num(c.officerSO),employee:num(c.employeeSO),vc:num(c.vcSO),other:num(c.otherSO)};}
function capSnapshot(label,d,sh,so,pub){
  const tb=CAP_KEYS.reduce((s,k)=>s+num(sh[k]),0)+pub;
  const soTot=CAP_KEYS.reduce((s,k)=>s+num(so[k]),0), tfd=tb+soTot;
  const rb={},rfd={};CAP_KEYS.forEach(k=>{rb[k]=tb?sh[k]/tb*100:0;rfd[k]=tfd?sh[k]/tfd*100:0;});
  return {label,offset:d,shares:{...sh},so:{...so},pub,totalBasic:tb,totalFD:tfd,soTot,floatPct:tb?pub/tb*100:0,ratioBasic:rb,ratioFD:rfd,fr:rb.founder,vcr:rb.vc,flr:tb?pub/tb*100:0};
}
function capSim(){
  const c=state.capital||{};
  let sh=capBase(), so=capBaseSO(), pub=0;
  const years=capYearOffsets(), snaps=[], equityByYear={}, evAmt=[];
  snaps.push(capSnapshot('現在',-1,sh,so,pub));
  years.forEach((yr,d)=>{
    (c.events||[]).filter(e=>Math.round(num(e.year))===yr).forEach(e=>{
      if(e.type==='issue'){
        const pre=CAP_KEYS.reduce((s,k)=>s+num(sh[k]),0)+pub;
        const price=pre>0?plannedEV(d)/pre:0, amt=num(e.shares)*price;
        if(e.party==='public')pub+=num(e.shares); else sh[e.party]=num(sh[e.party])+num(e.shares);
        equityByYear[yr]=(equityByYear[yr]||0)+amt; evAmt.push({year:yr,e,amt,price});
      }else if(e.type==='so'){ so[e.party]=num(so[e.party])+num(e.shares); }
      else if(e.type==='transfer'){ const n=num(e.shares); sh[e.from]=num(sh[e.from])-n; if(e.to==='public')pub+=n; else sh[e.to]=num(sh[e.to])+n; }
    });
    snaps.push(capSnapshot(capYearLabel(d)+'('+yr+'年度)',d,sh,so,pub));
  });
  return {years,snaps,equityByYear,evAmt};
}
/* IPO時スナップショット：連動IPO年度に対応する年を選ぶ。未定(null)のときは5年後を暫定使用（表示側で『未定』と明示） */
function capIpoSnap(sim){const iy=ipoYearNum();const base=(iy==null)?(capCurYear()+5):iy;const off=Math.round(base)-capCurYear();const idx=1+Math.max(0,Math.min(5,off));return sim.snaps[idx]||sim.snaps[sim.snaps.length-1];}
function capMetrics(){
  const c=state.capital||{}, sim=capSim();
  const cur=sim.snaps[0], ipo=capIpoSnap(sim), y5=sim.snaps[sim.snaps.length-1], y3=sim.snaps[Math.min(sim.snaps.length-1,4)];
  const ipoYrNum=ipoYearNum();               // null＝未定
  const ipoDefined=ipoYrNum!=null;
  const ipoYr=ipoDefined?ipoYrNum:-999999;   // 未定時はイベント抽出にヒットしない値
  const pub=(c.events||[]).filter(e=>Math.round(num(e.year))===ipoYr&&e.type==='issue'&&e.party==='public').reduce((a,e)=>a+num(e.shares),0);
  const sale=(c.events||[]).filter(e=>Math.round(num(e.year))===ipoYr&&e.type==='transfer'&&e.to==='public').reduce((a,e)=>a+num(e.shares),0);
  const offer=pub+sale, saleRatio=offer?sale/offer*100:0, pubRatio=offer?pub/offer*100:0;
  const floatRatio=ipo.floatPct, mktCap=capIpoValue(), floatCap=mktCap*floatRatio/100, conc=ipo.fr+ipo.vcr;
  let sc=5; const notes=[];
  if(saleRatio>50){sc--;notes.push('売出比率が高く需給悪化リスク');}
  if(floatRatio<25){sc--;notes.push('流通株式比率が低く流通株不足の懸念');}
  if(ipo.vcr>20){sc--;notes.push('VC保有比率が高くロックアップ解除後の売却圧力に留意');}
  if(conc>80){sc--;notes.push('大株主への集中度が高い');}
  if(floatCap<1000000000){sc--;notes.push('流通株式時価総額が小さく機関投資家の参加が限定的');}
  sc=Math.max(1,Math.min(5,sc)); if(!notes.length)notes.push('売出・流通株のバランスは概ね適正');
  return {sim,snaps:sim.snaps,steps:sim.snaps,cur,ipo,y3,y5,pub,sale,offer,saleRatio,pubRatio,floatRatio,mktCap,floatCap,conc,score:sc,notes,ipoYrNum,ipoDefined};
}
function founderAssets(){
  const c=state.capital||{}, m=capMetrics(), g=num(c.postGrowth)/100, v0=m.mktCap;
  const px=(v,t)=>t?v/t:0, p0=px(v0,m.ipo.totalBasic);

  ];
}
function capRatioChart(snaps){
  const n=snaps.length,W=Math.max(760,n*104),H=250,top=20,bot=44,plotH=H-top-bot,base=H-bot;
  const y=p=>base-(Math.max(0,Math.min(100,p))/100)*plotH;
  const series=[['founder','創業者','#1F2D5C'],['vc','VC','#C7A25B'],['officer','役員','#6366f1'],['employee','従業員','#10b981'],['other','その他','#9ca3af'],['float','流通','#dc2626']];
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="0" y1="${y(v).toFixed(1)}" x2="${W}" y2="${y(v).toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/><text x="2" y="${(y(v)-2).toFixed(1)}" font-size="8" fill="#9ca3af">${v}%</text>`;});
  series.forEach(([k,,col])=>{
    const pts=snaps.map((s,i)=>[(i+0.5)*(W/n), y(k==='float'?s.floatPct:s.ratioBasic[k])]);
    g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${col}"/>`);
  });

function capDonut(parts){
  const total=parts.reduce((s,p)=>s+p.value,0)||1;
  let a=-Math.PI/2; const r=70,cx=90,cy=90; let seg='';
  parts.forEach(p=>{
    if(p.value<=0)return;
    const ang=p.value/total*Math.PI*2, b=a+ang;
    const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(b), y2=cy+r*Math.sin(b);
    const large=ang>Math.PI?1:0;
    seg+=`<path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${p.color}"/>`;
    a=b;
  });
  seg+=`<circle cx="${cx}" cy="${cy}" r="42" fill="#fff"/>`;
  return `<svg viewBox="0 0 180 180" width="180" height="180">${seg}</svg>`;
}
function capTimelineChart(steps){
  const n=steps.length, W=Math.max(760,n*112), H=250, top=22, bot=44, plotH=H-top-bot, base=H-bot;
  const y=p=>base-(Math.max(0,Math.min(100,p))/100)*plotH;

  [[66.7,'絶対支配 66.7%','#10b981'],[50,'経営支配 50%','#1F2D5C'],[33.4,'拒否権 33.4%','#C7A25B'],[20,'影響力 20%','#dc2626']].forEach(b=>{
    g+=`<line x1="0" y1="${y(b[0]).toFixed(1)}" x2="${W}" y2="${y(b[0]).toFixed(1)}" stroke="${b[2]}" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>`;
    g+=`<text x="4" y="${(y(b[0])-3).toFixed(1)}" font-size="9" fill="${b[2]}">${b[1]}</text>`;
  });
  const pts=steps.map((s,i)=>[(i+0.5)*(W/n),y(s.fr)]);
  g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#1F2D5C" stroke-width="2.5"/>`;
  steps.forEach((s,i)=>{
    const x=(i+0.5)*(W/n);
    g+=`<circle cx="${x.toFixed(1)}" cy="${y(s.fr).toFixed(1)}" r="4" fill="#1F2D5C"/>`;
    g+=`<text x="${x.toFixed(1)}" y="${(y(s.fr)-9).toFixed(1)}" font-size="9.5" font-weight="700" fill="#1F2D5C" text-anchor="middle">${s.fr.toFixed(1)}%</text>`;
    g+=`<text x="${x.toFixed(1)}" y="${(H-26).toFixed(1)}" font-size="9" fill="#6B7280" text-anchor="middle">${s.label}</text>`;
  });
  return `<div style="overflow-x:auto;background:var(--cream);border-radius:8px;padding:10px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none">${g}</svg></div>`;
}

const CAP_CATS=['採用','営業投資','開発投資','設備投資','M&A','海外展開','DX','その他'];
function capYears(){
  const y0=baseYear();
  const iy=ipoYearNum();
  const yn=Math.max(y0+5, iy||0);   // 当期〜5年後を最低確保。IPOがそれ以降なら延長
  const n=Math.max(1,Math.min(10,yn-y0+1));
  return Array.from({length:n},(_,i)=>y0+i);
}
function capInvestByYear(){
  const m={};
  (state.investments||[]).forEach(x=>{const y=Math.round(num(x.year));if(y)m[y]=(m[y]||0)+num(x.amount);});
  return m;
}
function capInvestByCat(){
  const m={};
  CAP_CATS.forEach(k=>m[k]={count:0,amount:0,impact:0});
  (state.investments||[]).forEach(x=>{
    const k=CAP_CATS.includes(x.capCategory)?x.capCategory:'その他';
    m[k].count++; m[k].amount+=num(x.amount); m[k].impact+=num(x.impact);
  });
  return m;
}
function capFundingPlan(){
  const c=state.capital||{}, years=capYears(), inv=capInvestByYear();
  const pre=valuation().now;
  const dby=debtByYear(), sby=subsidyByYear(), eby=capSim().equityByYear;
  let cash=num(state.nc&&state.nc.now&&state.nc.now.cash);
  const rows=years.map((y,i)=>{
    const open=cash;
    const op=num((c.opCF||[])[i]);
    const invest=inv[y]||0;
    const bal=open+op-invest;
    const short=bal<0?-bal:0;
    const d=dby[y]||0, s=sby[y]||0, e=eby[y]||0;      // 資金調達タブ・希薄化イベントから自動連携
    const raise=d+s+e;
    const close=open+op-invest+raise;
    const dil=e>0&&(pre+e)>0?e/(pre+e)*100:0;
    cash=close;
    return {year:y,open,op,invest,bal,short,need:short,debt:d,subsidy:s,equity:e,raise,close,dil};
  });
  return {years,rows,totalDil:rows.reduce((s,r)=>s+r.dil,0),endCash:rows.length?rows[rows.length-1].close:0};
}
function capImpact(){
  const lf=liquidityCalc(), iv=investSums(), m=capMetrics(), k=kpis(), fp=capFundingPlan();
  const items=[];
  const g1=lf.surplus>=iv.investNeed?'A':(lf.surplus>=0?'B':'C');
  items.push({label:'成長投資余力',grade:g1,note:'余裕資金 '+yen(lf.surplus)+'千円 ／ 資金需要 '+yen(iv.investNeed)+'千円'});
  const tm=num(state.targetMargin);
  const g2=tm>0?(k.margin>=tm?'A':(k.margin>=tm*0.7?'B':'C')):'B';
  items.push({label:'資本効率',grade:g2,note:'EBITDA Margin '+k.margin.toFixed(1)+'% ／ 目標 '+tm+'%'});
  const dil=m.cur.fr-m.ipo.fr;
  const g3=dil<15?'A':(dil<30?'B':'C');
  items.push({label:'希薄化リスク',grade:g3,note:'現在→IPO時 '+dil.toFixed(1)+'pt の希薄化'});
  const g4=m.y5.fr>50?'A':(m.y5.fr>=33.4?'B':'C');

  const g5=m.score>=4?'A':(m.score===3?'B':'C');
  items.push({label:'IPO需給',grade:g5,note:'需給評価 '+'★'.repeat(m.score)+'☆'.repeat(5-m.score)});
  const g6=fp.endCash>0?(fp.endCash>=lf.need?'A':'B'):'C';
  items.push({label:'IPO後資金余力',grade:g6,note:'計画最終年度の期末現預金 '+yen(fp.endCash)+'千円'});
  const sc={A:3,B:2,C:1};
  const avg=items.reduce((s,x)=>s+sc[x.grade],0)/items.length;
  return {items,avg,total:avg>=2.5?'A':(avg>=1.7?'B':'C')};
}

function segAvgPER(sg){const c=(sg.comps||[]).map(x=>num(x.per)).filter(p=>p>0);return c.length?c.reduce((a,b)=>a+b,0)/c.length:0;}
/* 期別業績（月次連携・成長踏襲込み）の各期売上高 */
function periodSalesAt(pi){const ps=computedPeriods();return num((ps[pi]||{}).sales);}
/* 事業別の各期売上：最初の事業(idx0)＝期別業績売上 − 他事業合計（自動）、それ以外＝手入力 */
function segSales(i,pi){
  const segs=state.segments||[];
  if(i===0){
    let others=0; for(let k=1;k<segs.length;k++) others+=num((segs[k].sales||[])[pi]);
    return periodSalesAt(pi)-others;
  }
  return num((segs[i]&&segs[i].sales||[])[pi]);
}
function segTotalSales(idx){return (state.segments||[]).reduce((s,_,i)=>s+segSales(i,idx),0);}   // ＝期別業績売上（事業が1件以上あるとき）
function segRevShareIdx(i,idx){const t=periodSalesAt(idx);return t>0?segSales(i,idx)/t*100:0;}
function blendedPER(idx){
  if(idx==null)idx=3;                       // 既定＝当期(進行)予算
  const t=periodSalesAt(idx); if(t<=0)return 0;
  let acc=0; (state.segments||[]).forEach((sg,i)=>{acc+=(segSales(i,idx)/t)*segAvgPER(sg);});
  return acc;
}
/* 成長踏襲：将来期（1期後=idx4〜5期後=idx8）で growthFollow がONなら、
   売上＝直前3期から得た2期分の成長率の幾何平均（CAGR）で伸ばし、
   各利益率（粗利/営業利益/EBITDA/純利益）＝直前2期の率の平均で当該期を自動算定。
   直前期も踏襲なら連鎖する（昇順に計算するため）。state は変更せず算定結果の複製を返す。 */
function computedPeriods(){
  const ps=(state.periods||[]).map(p=>Object.assign({},p));
  /* 前期(idx2)＝月次「前期実績」の積み上げ、当期(進行)予算(idx3)＝月次「予算」の積み上げ を自動連携 */
  if(ps[2]) METRICS.forEach(([mk])=>{ ps[2][mk]=Math.round(priorTotal(mk)); });
  if(ps[3]) METRICS.forEach(([mk])=>{ ps[3][mk]=Math.round(budgetTotal(mk)); });
  for(let i=4;i<ps.length;i++){
    if(!ps[i].growthFollow) continue;
    const a=ps[i-2], b=ps[i-1], c=ps[i-3];      // b=直前期, a=2期前, c=3期前
    const sa=num(a.sales), sb=num(b.sales), sc=num(c?c.sales:0);
    // 売上：直前3期(c→a→b)の2期分成長率の幾何平均＝CAGR (sb/sc)^(1/2)-1
    const g=(sc>0&&sb>0)?(Math.pow(sb/sc,0.5)-1):0;
    const sales=Math.round(sb*(1+g));
    ps[i].sales=sales;
    ['gross','op','ebitda','net'].forEach(mk=>{
      const ra=sa>0?num(a[mk])/sa:0, rb=sb>0?num(b[mk])/sb:0;
      ps[i][mk]=Math.round(sales*((ra+rb)/2));  // 利益率は直前2期の率の平均を踏襲
    });
  }
  return ps;
}
function periodStageMult(idx){
  const st=(state.stages||[])[idx]; if(!st)return null;
  if(st.multLow!=null&&st.multLow!=='')return (num(st.multLow)+num(st.multHigh))/2;
  for(let j=idx+1;j<state.stages.length;j++){const s=state.stages[j];if(s.multLow!=null&&s.multLow!=='')return num(s.multLow);}
  return null;
}
function periodValue(p,idx){
  if(p.ipo){const per=blendedPER(idx);return {method:'PER '+per.toFixed(1)+'倍',value:num(p.net)*per};}
  const mid=periodStageMult(p.stageIdx);
  if(mid==null)return {method:'—',value:0};
  return {method:'EBITDA×'+mid.toFixed(1)+'倍',value:num(p.ebitda)*mid};
}

function tierHi(v,a,b,c){return v>=a?3:v>=b?2:v>=c?1:0;}   // 高いほど良い
function tierLo(v,a,b,c){return v<=a?3:v<=b?2:v<=c?1:0;}   // 低いほど良い（負債・集中度等）
function rGrade(s){return s>=3?'◎':s>=2?'○':s>=1?'△':'×';}
function rColor(s){return s>=3?'var(--green)':s>=2?'var(--navy)':s>=1?'var(--gold)':'var(--red)';}
function planCAGRpct(){const ps=computedPeriods();const a=num(ps[3].sales),b=num(ps[8].sales);return (a>0&&b>0)?(Math.pow(b/a,1/5)-1)*100:0;}
function reportSignal(pct){return pct>=75?{t:'Go（前向き）',c:'var(--green)',b:'rgba(16,185,129,.14)'}:pct>=50?{t:'条件付き',c:'var(--gold)',b:'rgba(199,162,91,.16)'}:{t:'見送り水準',c:'var(--red)',b:'rgba(220,38,38,.10)'};}
/* 高いほど良い指標：判定基準(basis)と次段階条件(next)を自動生成 */
function mHi(label,detail,v,a,b,c,u,fmt){fmt=fmt||(x=>''+x);const s=tierHi(v,a,b,c);
  const basis=`◎ ≥${fmt(a)}${u} ／ ○ ≥${fmt(b)}${u} ／ △ ≥${fmt(c)}${u} ／ × ＜${fmt(c)}${u}`;
  const next=s>=3?'最高評価（◎）':s===2?`◎へ：${fmt(a)}${u} 以上`:s===1?`○へ：${fmt(b)}${u} 以上`:`△へ：${fmt(c)}${u} 以上`;
  return {label,detail,score:s,basis,next};}
/* 低いほど良い指標 */
function mLo(label,detail,v,a,b,c,u,fmt){fmt=fmt||(x=>''+x);const s=tierLo(v,a,b,c);
  const basis=`◎ ≤${fmt(a)}${u} ／ ○ ≤${fmt(b)}${u} ／ △ ≤${fmt(c)}${u} ／ × ＞${fmt(c)}${u}`;
  const next=s>=3?'最高評価（◎）':s===2?`◎へ：${fmt(a)}${u} 以下`:s===1?`○へ：${fmt(b)}${u} 以下`:`△へ：${fmt(c)}${u} 以下`;
  return {label,detail,score:s,basis,next};}
/* 個別指標：判定基準と、現スコアから見た次段階条件（nexts[0..2]）を明示 */

/* =========================================================
   借入戦略（Debt Strategy / Financing Navigation）
   ========================================================= */
const LOAN_PURPOSES=['短期運転資金','長期運転資金','正常運転資金','設備資金','不動産取得','M&A資金','納税資金','賞与資金','大型案件・先行仕入資金','その他'];
const LOAN_METHODS=['元金均等','元利均等','期日一括'];
const SHORT_PURPOSES=['短期運転資金','納税資金','賞与資金','大型案件・先行仕入資金'];
function ipoMode(){return ipoYearNum()!=null;}   // 期別業績のIPOチェック連動＝IPO準備モード
function loanRemainYears(l){const ry=num(l.remainYears);return ry>0?ry:1;}
function loanIsShort(l){return l.category==='short';}
/* 1本の当年ベース：年間元金・利息・元利、月次 */
function loanCalc(l){
  const bal=num(l.balance), r=num(l.rate)/100, n=Math.max(0.5,loanRemainYears(l)), method=l.method||'元利均等';
  let annP=0,annI=bal*r;
  if(method==='期日一括'){annP=(n<=1)?bal:0;}
  else if(method==='元金均等'){annP=bal/n;}
  else{const rm=r/12,m=n*12;let pay=rm>0?bal*rm/(1-Math.pow(1+rm,-m)):bal/m;annP=Math.max(0,pay*12-annI);}
  annP=Math.min(annP,bal);
  return {bal,rate:r,n,method,annP,annI,annDS:annP+annI,monP:annP/12,monI:annI/12};
}
/* 既存借入の短期/長期残高（借入戦略タブを正とする） */
function existingDebtParts(){
  if((state.loans||[]).length){const s=loanSummary();return {std:s.shortB,ltd:s.longB};}
  const n=(state.nc&&state.nc.now)||{};return {std:num(n.std),ltd:num(n.ltd)};
}
function loanSummary(){
  const ls=state.loans||[];
  let total=0,shortB=0,longB=0,due1y=0,annP=0,annI=0,rateW=0,guarB=0,ceoB=0,noGuarB=0,collB=0;
  ls.forEach(l=>{const c=loanCalc(l),bal=c.bal;
    total+=bal; if(loanIsShort(l))shortB+=bal; else longB+=bal;
    let due=c.annP; if(l.method==='期日一括'&&c.n<=1)due=bal; due1y+=Math.min(bal,due);
    annP+=c.annP; annI+=c.annI; rateW+=bal*num(l.rate);
    if(l.creditGuarantee)guarB+=bal; if(l.ceoGuarantee)ceoB+=bal;
    if(l.collateral)collB+=bal;
    if(!l.creditGuarantee&&!l.ceoGuarantee&&!l.thirdPartyGuarantee&&!l.collateral)noGuarB+=bal;
  });
  const byBank={}; ls.forEach(l=>{const b=l.bank||'（未設定）';byBank[b]=(byBank[b]||0)+num(l.balance);});
  return {total,shortB,longB,due1y,annP,annI,annDS:annP+annI,avgRate:total>0?rateW/total/1:0,byBank,guarB,ceoB,noGuarB,collB,count:ls.length};
}
/* 年度別 返済スケジュール（各借入を償却シミュレーション） */
function loanSchedule(years){
  years=years||10;
  const ls=(state.loans||[]).map(l=>({l,bal:num(l.balance),n:Math.max(1,Math.round(loanRemainYears(l))),r:num(l.rate)/100,ap0:loanCalc(l).annDS,pf:num(l.balance)/Math.max(1,Math.round(loanRemainYears(l)))}));
  const rows=[];
  for(let y=0;y<years;y++){
    let p=0,i=0,endBal=0;
    ls.forEach(o=>{const l=o.l;if(o.bal<=0.5)return;
      let iy=o.bal*o.r, py=0;
      if(l.method==='期日一括'){ py=(loanRemainYears(l)-y<=1)?o.bal:0; iy=o.bal*o.r; }
      else if(l.method==='元金均等'){ py=Math.min(o.bal,o.pf); }
      else { py=Math.min(o.bal, o.ap0-iy); if(py<0)py=0; }
      o.bal=Math.max(0,o.bal-py); p+=py; i+=iy;
    });
    ls.forEach(o=>endBal+=o.bal);
    rows.push({fy:baseYear()+y,principal:p,interest:i,ds:p+i,endBal});
    if(endBal<=0.5&&p<=0.5&&i<=0.5)break;
  }
  return rows;
}
/* 返済原資：簡便＝税引後純利益＋減価償却／調整後 */
function depreciationNow(){const d=state.debtCfg||{};if(num(d.depOverride)>0)return num(d.depOverride);return Math.max(0,landing('ebitda')-landing('op'));}
function repayResource(){
  const netP=landing('net'), dep=depreciationNow(), simple=netP+dep, cfg=state.debtCfg||{};
  const adj=simple+num(cfg.wcChange)-num(cfg.maintCapex)-num(cfg.oneTime)+num(cfg.otherCF);
  return {netP,dep,simple,adj,use:cfg.useAdjusted?adj:simple};
}
function dscrNow(){const rr=repayResource().use,s=loanSummary();return s.annDS>0?rr/s.annDS:null;}
/* 将来DSCR：期別業績(当期〜5年後)の返済原資 ÷ その年の元利返済 */
function dscrFuture(){
  const cp=computedPeriods(), sched=loanSchedule(6), rows=[];
  for(let d=0;d<6;d++){const p=cp[3+d];if(!p)break;
    const rr=num(p.net)+Math.max(0,num(p.ebitda)-num(p.op));
    const sc=sched[d], ds=sc?sc.ds:0;
    rows.push({fy:baseYear()+d,rr,ds,dscr:ds>0?rr/ds:null});
  }
  return rows;
}
/* 新規借入余力 */
function borrowCapacity(){
  const cfg=state.debtCfg||{}, target=num(cfg.targetDSCR)||1.2, rr=repayResource().use, s=loanSummary();
  const annCap=target>0?rr/target:0, newRoom=annCap-s.annDS;
  return {target,rr,annCap,existingDS:s.annDS,newRoom};
}
/* 年間元利返済額から逆算した借入可能元本 */
function loanPrincipalFromDS(annDS,rate,years,method){
  const r=num(rate)/100,n=Math.max(0.5,num(years));if(annDS<=0)return 0;
  if(method==='期日一括')return r>0?annDS/r:0;
  if(method==='元金均等')return annDS/(1/n+r);
  const rm=r/12,m=n*12,monthly=annDS/12;return rm>0?monthly*(1-Math.pow(1+rm,-m))/rm:monthly*m;
}
function capacityByTerm(){
  const bc=borrowCapacity(),cfg=state.debtCfg||{},rate=num(cfg.newRate)||2,method=cfg.newMethod||'元利均等';
  return [3,5,7,10,15].map(y=>({years:y,amount:bc.newRoom>0?loanPrincipalFromDS(bc.newRoom,rate,y,method):0}));
}
/* 指定条件の借入の年間返済（新規/シミュレーション用） */
function newLoanAnnual(amount,rate,years,method){
  const bal=num(amount),r=num(rate)/100,n=Math.max(0.5,num(years));let annP=0,annI=bal*r;
  if(method==='期日一括')annP=0;
  else if(method==='元金均等')annP=bal/n;
  else{const rm=r/12,m=n*12,pay=rm>0?bal*rm/(1-Math.pow(1+rm,-m)):bal/m;annP=Math.max(0,pay*12-annI);}
  return {annP,annI,annDS:annP+annI};
}
/* 返済期間シミュレーション（複数ケース） */
function termScenarios(amount,rate,method){
  const cfg=state.debtCfg||{};rate=rate==null?num(cfg.newRate)||2:rate;method=method||cfg.newMethod||'元利均等';amount=amount==null?num(cfg.simAmount):amount;
  const rr=repayResource().use, exDS=loanSummary().annDS;
  return [3,5,7,10,15].map(y=>{const nl=newLoanAnnual(amount,rate,y,method);const totDS=exDS+nl.annDS;
    return {years:y,annDS:nl.annDS,dscrAfter:totDS>0?rr/totDS:null,endBalYr:'—',done:baseYear()+y};});
}
/* 運転資金分析 */
function workingCapital(){
  const n=(state.nc&&state.nc.now)||{},cfg=state.debtCfg||{};
  const ar=num(n.ar),inv=num(cfg.inventory),ap=num(n.ap);
  const normal=ar+inv-ap;
  const sales=landing('sales'), cogs=Math.max(0,sales-landing('gross'));
  const arDays=sales>0?ar/(sales/365):0, invDays=cogs>0?inv/(cogs/365):0, apDays=cogs>0?ap/(cogs/365):0;
  const ccc=arDays+invDays-apDays;
  return {ar,inv,ap,normal,arDays,invDays,apDays,ccc,sales,cogs};
}
/* 資金調達シミュレーター */
function fundingSim(){
  const cfg=state.debtCfg||{}, amt=num(cfg.simAmount),rate=num(cfg.simRate)||2,yrs=num(cfg.simTermYears)||7,method=cfg.simMethod||'元利均等';
  const nl=newLoanAnnual(amt,rate,yrs,method);
  const s=loanSummary(), rrBase=repayResource().use;
  const addCF=num(cfg.simProfitUp)+num(cfg.simDepUp);        // 投資による返済原資増（利益増＋減価償却増）
  const rrAfter=rrBase+addCF;
  const dsAfter=s.annDS+nl.annDS;
  const dscrBefore=s.annDS>0?rrBase/s.annDS:null, dscrAfter=dsAfter>0?rrAfter/dsAfter:null;
  const totalDebtAfter=s.total+amt;
  const v=valuation(); const evUplift=(v.M!=null?(num(cfg.simProfitUp)+num(cfg.simDepUp))*v.M:0); const evAfter=v.now+evUplift;
  // 現預金推移（簡易：期首現預金＋今回調達、各年 ＋返済原資後CF −元利返済）
  const cash0=num((state.nc&&state.nc.now&&state.nc.now.cash))+amt;
  const cp=computedPeriods(); const cashRows=[]; let cash=cash0;
  for(let d=0;d<5;d++){const p=cp[3+d];const rr=(p?num(p.net)+Math.max(0,num(p.ebitda)-num(p.op)):rrBase)+ (d>=0?addCF:0);
    const ds=dsAfter; cash=cash+rr-ds; cashRows.push({fy:baseYear()+d,cash});}
  // 将来DSCR（新規借入込み）
  const fut=dscrFuture().map((r,d)=>({fy:r.fy,dscr:(r.ds+nl.annDS)>0?(r.rr+addCF)/(r.ds+nl.annDS):null}));
  return {amt,rate,yrs,method,nl,rrBase,rrAfter,dsAfter,dscrBefore,dscrAfter,totalDebtAfter,evAfter,evUplift,cashRows,fut,addCF};
}

  if(wc.normal>0&&s.shortB>wc.normal*1.5)a.push({lv:'amber',t:'正常運転資金に対し短期借入が過大。長期運転資金・短期継続融資等への組替を検討。'});
  const peak=sched.slice().sort((x,y)=>y.principal-x.principal)[0]; if(peak&&s.total>0&&peak.principal>s.total*0.4)a.push({lv:'amber',t:esc(peak.fy)+'年度に返済（元金）が集中しています（'+yen(peak.principal)+'千円）。'});
  if(ipoMode()){
    if(s.ceoB>0)a.push({lv:'red',t:'IPO準備モード：代表者保証が残存しています（'+yen(s.ceoB)+'千円）。解消・整理の確認が必要です。'});
    if((state.loans||[]).some(l=>l.ceoAssetPledge))a.push({lv:'red',t:'IPO準備モード：経営者個人資産への担保設定が残存しています。整理の確認が必要です。'});
    if((state.loans||[]).some(l=>l.thirdPartyGuarantee))a.push({lv:'amber',t:'IPO準備モード：第三者保証が残存しています。整理の確認が必要です。'});
    if((state.loans||[]).some(l=>l.specialFinCovenant))a.push({lv:'amber',t:'IPO準備モード：特殊な財務制限条項があります。内容の確認が必要です。'});
    if((state.loans||[]).some(l=>l.relatedPartyFunding))a.push({lv:'amber',t:'IPO準備モード：関係当事者との資金関係があります。整理の確認が必要です。'});
  }
  if((state.loans||[]).some(l=>l.covenant)&&dn!=null&&dn<target)a.push({lv:'amber',t:'コベナンツ付き借入があり、DSCRが目標を下回っています。抵触可能性を確認してください。'});
  return a;
}

/* 単一借入（新規/シミュ）の年度別償却 */
function scheduleFor(amount,rate,years,method,horizon){
  horizon=horizon||6;let bal=num(amount);const r=num(rate)/100,n=Math.max(1,Math.round(num(years)));const pf=bal/n;
  const ap0=newLoanAnnual(amount,rate,years,method).annDS;const rows=[];
  for(let y=0;y<horizon;y++){let iy=bal*r,py=0;
    if(bal<=0.5){rows.push({fy:baseYear()+y,principal:0,interest:0,ds:0,endBal:0});continue;}
    if(method==='期日一括'){py=(n-y<=1)?bal:0;}
    else if(method==='元金均等'){py=Math.min(bal,pf);}
    else{py=Math.min(bal,ap0-iy);if(py<0)py=0;}
    bal=Math.max(0,bal-py);rows.push({fy:baseYear()+y,principal:py,interest:iy,ds:py+iy,endBal:bal});}
  return rows;
}

  const opts=unmetIssueOptions();
  const extra=(a.resolves&&!opts.includes(a.resolves))?`<option selected>${esc(a.resolves)}</option>`:'';
  return `<div class="action-edit">
    <div class="ahead"><strong>アクション ${i+1}</strong>
      <button class="btn btn-danger" onclick="removeAction(${i})">削除</button></div>
    <div class="field"><label>タイトル</label><input value="${esc(a.title)}" oninput="setActionText(${i},'title',this.value)"></div>
    <div class="grid3">
      <div class="field"><label>担当者</label><input value="${esc(a.owner)}" oninput="setActionText(${i},'owner',this.value)"></div>
      ${monthSelect("開始月",a.start,i,"start")}
      ${monthSelect("終了月",a.end,i,"end")}
    </div>
    <div class="field"><label>期待インパクト</label><input value="${esc(a.impact)}" oninput="setActionText(${i},'impact',this.value)"></div>
    <div class="field"><label>状態ゴール（達成時の状態イメージ＝進捗の目安）</label><input value="${esc(a.goal||'')}" oninput="setActionText(${i},'goal',this.value)" placeholder="例：新規商談を月10件安定創出／月次決算を翌月10営業日で完了" data-nofmt></div>
    <div class="field"><label>解消課題（ステージ判定の未達項目／投資アクション／その他）</label>
      <select onchange="setAction(${i},'resolves',this.value)">
        <option value="" ${!a.resolves?'selected':''}>（未選択）</option>
        ${opts.map(o=>`<option ${a.resolves===o?'selected':''}>${esc(o)}</option>`).join("")}
        ${extra}
      </select></div>
    <div class="field"><label>状況メモ（担当者の動きなど自由記入）</label><textarea rows="2" oninput="setActionText(${i},'note',this.value)">${esc(a.note||"")}</textarea></div>
    <div class="grid3">
      <div class="field"><label>ステータス</label>
        <select onchange="setAction(${i},'status',this.value)">
          ${[["plan","計画中"],["doing","実行中"],["done","完了"]].map(o=>`<option value="${o[0]}" ${a.status===o[0]?'selected':''}>${o[1]}</option>`).join("")}
        </select></div>
      <div class="field"><label>進捗（${num(a.progress)}%）</label>
        <input type="range" min="0" max="100" value="${num(a.progress)}" oninput="setActionText(${i},'progress',parseNum(this.value))"></div>
      <div></div>
    </div>
  </div>`;
}
function monthSelect(label,val,i,key){
  return `<div class="field"><label>${label}</label><select onchange="setAction(${i},'${key}',this.value)">
    ${mlabels().map(m=>`<option ${m===val?'selected':''}>${m}</option>`).join("")}</select></div>`;
}

/* =========================================================
   入力ハンドラ
   ========================================================= */
function parseNum(v){if(v==null)return 0;const s=String(v).replace(/[^0-9.\-]/g,'');return (s===''||s==='-'||s==='.')?0:(parseFloat(s)||0);}
/* 金額・株数入力の3桁カンマ表示 */
function fmtCommaStr(v){if(v==null||v==='')return '';let s=String(v).trim();const neg=s.startsWith('-');s=s.replace(/[^0-9.]/g,'');if(s==='')return neg?'-':'';const parts=s.split('.');let intp=parts[0].replace(/^0+(?=\d)/,'');let out=intp===''?'0':Number(intp).toLocaleString('en-US');if(parts.length>1)out+='.'+parts.slice(1).join('').slice(0,4);return (neg?'-':'')+out;}
function decorateCommas(){
  try{document.querySelectorAll('input[type="number"]').forEach(el=>{
    if(el.dataset.nofmt!=null)return;
    const raw=el.value;
    el.type='text';el.setAttribute('inputmode','decimal');el.classList.add('ci');
    el.value=fmtCommaStr(raw);
  });}catch(e){}
}
function flashSaved(){const n=$("savedNote");if(!n)return;n.style.opacity=1;clearTimeout(window._st);window._st=setTimeout(()=>n.style.opacity=0,1200);}
function commit(rerenderInput){
  saveState();
  setHeader();
  renderCompass();renderDetails();renderStageCheck();renderSalesPlan();renderInvest();renderFunding();renderCapital();renderBankDoc();renderReport();renderLoans();renderAction();renderMemo();
  if(rerenderInput)renderInput();
  decorateCommas();
  flashSaved();
}
function setVal(key,v){
  state[key]=v;
  commit(false);
  if(["hasBizPlan","targetStageIdx","fiscalStart","baseYear"].includes(key))renderInput();
}
function setToday(){
  const d=new Date();
  state.asOf=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  commit(true);
}
function setMonth(i,metric,fld,v){
  state.months[i][metric][fld]= (fld==="a"&&v==="")?null:parseNum(v);
  commit(false);
}
function setNC(period,key,v){
  if(!state.nc)state.nc={now:{},prev:{}};
  if(!state.nc[period])state.nc[period]={};
  state.nc[period][key]=parseNum(v);
  commit(false);
  // フォーカスを保ったまま合計行だけ即時更新
  const tp=$("ncTotalPrev"); if(tp)tp.textContent=signed(netCash('prev'))+"千円";
  const tn=$("ncTotalNow"); if(tn)tn.textContent=signed(netCash('now'))+"千円";
}
function setStage(i,field,v){state.stages[i][field]=v;commit(true);}
function toggleCheck(i,j){state.stages[i].items[j].done=!state.stages[i].items[j].done;commit(true);}
function setAllChecks(i,val){state.stages[i].items.forEach(it=>it.done=val);commit(true);}
function setCheckLabel(i,j,v){state.stages[i].items[j].label=v;commit(false);}
function setCheckEx(i,j,v){state.stages[i].items[j].ex=v;commit(false);}
function toggleCheckIpo(i,j){state.stages[i].items[j].ipo=!state.stages[i].items[j].ipo;commit(true);}
function toggleShowIpoReq(){state.showIpoReq=!state.showIpoReq;commit(true);}
function setCheckWeight(i,j,v){state.stages[i].items[j].w=Math.max(1,Math.min(5,Math.round(parseNum(v))||1));commit(true);}
function addCheck(i){state.stages[i].items.push({label:"新規項目",ex:"",ipo:false,done:false,w:3});commit(true);}
function removeCheck(i,j){state.stages[i].items.splice(j,1);commit(true);}
function addAdj(kind){state[kind].push({label:"",amount:0});commit(true);}
function removeAdj(kind,j){state[kind].splice(j,1);commit(true);}
function setAdjLabel(kind,j,v){state[kind][j].label=v;commit(false);}
function setAdjAmount(kind,j,v){state[kind][j].amount=parseNum(v);commit(false);}
function setAction(i,key,v){state.actions[i][key]=v;commit(false);}
function setActionText(i,key,v){state.actions[i][key]=v;saveState();renderCompass();renderAction();}
function addAction(){
  state.actions.push({title:"新規アクション",owner:"",start:mlabels()[0],end:mlabels()[2],impact:"",resolves:"",goal:"",status:"plan",progress:0,note:""});
  commit(false);
}
function removeAction(i){state.actions.splice(i,1);commit(false);}

/* ---------- タブ切替 ---------- */
function goTab(name){
  document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
  $(name).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.tab)));

/* ---------- CSV ユーティリティ ---------- */
function csvCell(v){v=(v==null)?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
/* CSVの数値を頑健に解釈（桁区切りカンマ・通貨記号・全角数字・各種マイナスを除去） */
function csvNum(v){
  if(v==null) return null;
  let s=String(v).trim();
  if(s==="") return null;
  s=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/．/g,".").replace(/[，､]/g,",");
  s=s.replace(/[‐‐-―–—−ー－]/g,"-");   // 各種マイナス → 半角
  s=s.replace(/[,\s¥￥円]/g,"");                  // 桁区切り・通貨記号・空白を除去
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
function parseCSVLine(line){const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c===','){out.push(cur);cur="";}else if(c==='"'){q=true;}else cur+=c;}}
  out.push(cur);return out;}
function download(content,name,type){
  const b=new Blob([content],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}

/* ---------- 月次CSV 入出力（単位：円） ---------- */
function exportMonthlyCSV(){
  const head=["月"]; METRICS.forEach(([k,l])=>head.push(l+"_実績(円)",l+"_予算(円)",l+"_前期実績(円)"));
  const L=[head.map(csvCell).join(",")];
  const labels=mlabels();
  state.months.forEach((m,i)=>{
    const row=[labels[i]];
    METRICS.forEach(([k])=>row.push(m[k].a==null?"":m[k].a, m[k].b==null?"":m[k].b, m[k].p==null?"":m[k].p));
    L.push(row.map(csvCell).join(","));
  });
  download("﻿"+L.join("\r\n"),"aurevia_monthly_"+(state.company||"data").replace(/\s+/g,"_")+".csv","text/csv;charset=utf-8");
}
function importMonthlyCSV(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const text=r.result.replace(/^﻿/,"");
    const lines=text.split(/\r?\n/).filter(l=>l.trim()!=="");
    let row=0;
    for(let li=1;li<lines.length && row<12;li++){
      const c=parseCSVLine(lines[li]);
      const m=state.months[row];
      METRICS.forEach(([k],mi)=>{
        const base=1+mi*3;
        const a=csvNum(c[base]), b=csvNum(c[base+1]), p=csvNum(c[base+2]);
        m[k].a=(a==null)?null:a;
        m[k].b=(b==null)?0:b;
        m[k].p=(p==null)?0:p;
      });
      row++;
    }
    commit(true);alert("月次CSVを読み込みました（"+row+"か月分）。");
  }catch(e){alert("月次CSVの読み込みに失敗しました：\n"+e.message);}};
  r.readAsText(f);ev.target.value="";
}

/* ---------- 全データの保存／読み込み（顧客ごと・JSON） ---------- */
function exportJSON(){
  const d=new Date(), mmdd=String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const name="aurevia_"+(state.company||"data").replace(/\s+/g,"_")+"_"+mmdd;   // 社名＋入力日付(MMDD)
  download(JSON.stringify(state,null,2),name+".json","application/json");
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
      state=migrate(Object.assign(defaultState(),JSON.parse(r.result)));
      // 会社名・期首月・基準年度・更新時点はJSONではなく共通DBを正本とする
      applyCommonDbToState();
      commit(true);
      alert("保存データを読み込みました。会社名・会計期間は共通DBの情報を優先しています。");
    }catch(e){alert("ファイルの読み込みに失敗しました。");}};
  r.readAsText(f);ev.target.value="";
}
function resetState(){
  if(confirm("企業価値経営アプリ固有の入力内容を初期化しますか？ 共通DBの会計データは変更されません。")){state=defaultState();applyCommonDbToState();commit(true);}
}

/* ---------- 金額・株数入力：入力中に3桁カンマを反映 ---------- */
document.addEventListener('input',function(e){
  const el=e.target;
  if(el&&el.classList&&el.classList.contains('ci')&&el.dataset.nofmt==null){
    const start=el.selectionStart, before=el.value;
    const digitsBefore=(before.slice(0,start).match(/[0-9]/g)||[]).length;
    el.value=fmtCommaStr(before);
    // キャレット位置を桁数ベースで復元
    let pos=0,seen=0;while(pos<el.value.length&&seen<digitsBefore){if(/[0-9]/.test(el.value[pos]))seen++;pos++;}
    try{el.setSelectionRange(pos,pos);}catch(_){}
  }
},true);

/* ---------- 起動 ---------- */
initCloud();
